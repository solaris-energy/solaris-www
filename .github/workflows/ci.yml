name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.11.0"

jobs:
  # ------------------------------------------------------------------------
  # 1. Static checks — fastest gate, fails the rest of CI early.
  # ------------------------------------------------------------------------
  static:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # ------------------------------------------------------------------------
  # 2. Build + bundle budgets. The default (non-export) build, same one
  # lhci/e2e serve with `next start`. The Pages export build is owned by
  # deploy-pages.yml.
  # ------------------------------------------------------------------------
  build:
    name: build + bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:budgets

  # ------------------------------------------------------------------------
  # 3. Lighthouse CI. Rebuilds instead of sharing an artifact with `build`:
  # the build takes <1 min and a fresh .next avoids upload/download of
  # hidden-dot directories.
  #
  # Throttling note (lighthouserc.json): the scaffold's hand-rolled
  # throttling block applied cpuSlowdownMultiplier 4 (mobile-class) on top
  # of the desktop preset, whose scoring curve is calibrated for 1x. That
  # mismatch put React 19 hydration + framer-motion at 257-357 ms TBT
  # across runs (PR #3, 2026-06-10) with maplibre already fully deferred —
  # an unreachable bar for this stack. The config now uses the desktop
  # preset's own throttling defaults; the assertions are unchanged.
  # ------------------------------------------------------------------------
  lhci:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lhci

  # ------------------------------------------------------------------------
  # 4. Playwright e2e. Same rebuild rationale as lhci.
  # ------------------------------------------------------------------------
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
