name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.11.0"

jobs:
  # ------------------------------------------------------------------------
  # 1. Static checks — fastest gate, fails the rest of CI early.
  # ------------------------------------------------------------------------
  static:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # format:check disabled until prettier --write is run on the initial scaffold.
      # Re-enable once `npm run format` has been committed.
      # - run: npm run format:check

  # ------------------------------------------------------------------------
