name: deploy-pages

# Static export -> GitHub Pages. Separate from ci.yml on purpose: this
# workflow is the only one that builds + ships, ci.yml stays as the
# fast static-checks gate.

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deployment requires these elevated permissions on the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may be in flight at a time. Newer pushes
# cancel older queued runs but never interrupt one that's already
# uploading the artifact (avoids half-shipped sites).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22.11.0"
  # The site is served at https://solaris-energy.github.io/solaris-www/, so
  # every static asset URL and every Next route needs this prefix.
  NEXT_PUBLIC_BASE_PATH: /solaris-www

jobs:
  build:
    name: build static export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
          NEXT_OUTPUT: export

      - name: disable jekyll
        # GitHub Pages otherwise runs Jekyll, which strips files / dirs
        # starting with an underscore. Next emits _next/ for its chunks.
        run: touch out/.nojekyll

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: deploy to github pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
